<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alessandro Lanfrancotti</title>
  <meta name="description" content="Alessandro Lanfrancotti — Selected Projects e Gray Garden." />
  <link rel="stylesheet" href="/css/site.css" />
</head>

<body class="home">
  <div id="site-header"></div>

  <main class="stage" aria-label="Homepage">
    <div class="stage__video">
      <video
        id="bgVideo"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        disablepictureinpicture
      ></video>
      <script>
        fetch('/api/homepage').then(r=>r.json()).then(d=>{
          if(d.src){var v=document.getElementById('bgVideo');v.src=d.src;v.load();}
        }).catch(()=>{});
      </script>
    </div>

    <div class="stage__overlay" aria-hidden="true"></div>
  </main>

  <div id="site-footer"></div>
  <script src="/js/site.js"></script>

  
</body>
</html>
